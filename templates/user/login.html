<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Your Orders — {{ settings.brand_name }}</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon.svg') }}">
<link rel="alternate icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="simple-header">
  <div class="wrap">
    <a href="/" class="logo" style="font-size:20px;">SIZZLING <em>by KBA</em></a>
    <a href="/" class="btn btn-outline" style="padding:8px 16px; font-size:12.5px;">← Back to Shop</a>
  </div>
</div>

<div class="simple-page">
  <div class="wrap" style="max-width:480px;">
    <div style="text-align:center; margin-bottom:32px;">
      <div style="font-size:48px; margin-bottom:12px;">👔</div>
      <h1 style="font-size:28px; margin-bottom:8px;">Track Your Orders</h1>
      <p class="sub" style="margin-bottom:0;">Enter your mobile number to view your past orders, real-time tailoring status, and saved wishlist.</p>
    </div>

    <div class="form-card">
      <form id="directLoginForm">
        <div class="field" style="margin-bottom:16px;">
          <label for="loginPhone">Your Mobile Number</label>
          <input type="tel" id="loginPhone" placeholder="10-digit number (e.g. 8595511923)"
                 maxlength="10" inputmode="numeric" pattern="[0-9]*" required autocomplete="tel" autofocus>
          <small style="color:#777; font-size:12px; margin-top:4px; display:block;">Enter the number you used while placing your order.</small>
        </div>

        <div class="field" style="margin-bottom:20px;">
          <label for="loginName">Your Name <span style="opacity:0.5; font-weight:normal;">(optional)</span></label>
          <input type="text" id="loginName" placeholder="e.g. Kashyap Nathoo" autocomplete="name">
        </div>

        <button type="submit" class="btn btn-brass" id="loginSubmitBtn" style="width:100%; padding:14px; font-size:14px; font-weight:700;">
          View My Orders &amp; Wishlist →
        </button>

        <div id="loginStatus" class="form-status" style="margin-top:14px; text-align:center;"></div>
      </form>
    </div>

    <div style="text-align:center; font-size:13px; color:#777; margin-top:18px;">
      Need assistance with an existing order? <a href="https://wa.me/{{ settings.whatsapp_number }}" target="_blank" style="color:var(--brass); text-decoration:underline;">Chat with us on WhatsApp</a>
    </div>
  </div>
</div>

<script>
  const nextUrl = new URLSearchParams(window.location.search).get("next") || "/account/orders";

  document.getElementById("directLoginForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const phone = document.getElementById("loginPhone").value.trim();
    const name = document.getElementById("loginName").value.trim();
    const statusEl = document.getElementById("loginStatus");
    const btn = document.getElementById("loginSubmitBtn");

    if (!/^\d{10}$/.test(phone)) {
      statusEl.textContent = "Please enter a valid 10-digit mobile number.";
      statusEl.className = "form-status error";
      return;
    }

    btn.disabled = true;
    btn.textContent = "Loading orders...";
    statusEl.textContent = "";

    fetch(`/api/account/direct_login?next=${encodeURIComponent(nextUrl)}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ phone, name })
    })
    .then(r => r.json())
    .then(res => {
      if (res.success) {
        statusEl.textContent = "✓ Verified! Loading your orders...";
        statusEl.className = "form-status success";
        window.location.href = res.redirect || nextUrl;
      } else {
        statusEl.textContent = res.error || "Login failed. Please try again.";
        statusEl.className = "form-status error";
        btn.disabled = false;
        btn.textContent = "View My Orders & Wishlist →";
      }
    })
    .catch(() => {
      statusEl.textContent = "Network error. Please try again.";
      statusEl.className = "form-status error";
      btn.disabled = false;
      btn.textContent = "View My Orders & Wishlist →";
    });
  });
</script>

</body>
</html>
