<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — {{ settings.brand_name }}</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon.svg') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="simple-header">
  <div class="wrap">
    <a href="/" class="logo" style="font-size:20px;">SIZZLING <em>by KBA</em></a>
    <a href="/" class="btn btn-outline" style="padding:8px 16px; font-size:12.5px;">← Back to Shop</a>
  </div>
</div>

<div class="simple-page">
  <div class="wrap" style="max-width:480px;">
    <div style="text-align:center; margin-bottom:36px;">
      <div style="font-size:48px; margin-bottom:12px;">👔</div>
      <h1 style="font-size:28px; margin-bottom:8px;">Track Your Orders</h1>
      <p class="sub" style="margin-bottom:0;">Login with your phone number to view order history, track status, and manage your wishlist.</p>
    </div>

    <div class="form-card">
      <!-- Step 1: Phone number -->
      <div id="stepPhone">
        <div class="field" style="margin-bottom:16px;">
          <label for="loginPhone">Your Mobile Number</label>
          <input type="tel" id="loginPhone" placeholder="10-digit number (e.g. 9811551935)"
                 maxlength="10" inputmode="numeric" pattern="[0-9]*">
        </div>
        <button class="btn btn-brass" id="sendOtpBtn" style="width:100%; padding:14px; font-size:14px;">
          Send OTP →
        </button>
        <div id="sendOtpStatus" class="form-status" style="margin-top:12px;"></div>
      </div>

      <!-- Step 2: OTP + Name -->
      <div id="stepOtp" style="display:none;">
        <div id="otpInfoBox" style="font-size:14px; color:#444; margin-bottom:18px; padding:14px; background:var(--ivory); border-radius:3px; border-left:3px solid var(--brass); line-height:1.5;">
          📱 OTP sent to <strong id="phoneSummary"></strong>. Valid for 10 minutes.
        </div>
        <div class="field" style="margin-bottom:14px;">
          <label for="loginOtp">Enter OTP</label>
          <input type="text" id="loginOtp" placeholder="6-digit OTP" maxlength="6"
                 inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code">
        </div>
        <div class="field" style="margin-bottom:16px;">
          <label for="loginName">Your Name <span style="opacity:0.5;">(first time only)</span></label>
          <input type="text" id="loginName" placeholder="Full name">
        </div>
        <button class="btn btn-brass" id="verifyOtpBtn" style="width:100%; padding:14px; font-size:14px;">
          Verify & Login →
        </button>
        <div id="verifyOtpStatus" class="form-status" style="margin-top:12px;"></div>
        <button type="button" id="backToPhoneBtn" class="btn-change-number">
          ← Change Mobile Number
        </button>
      </div>
    </div>

  </div>
</div>

<style>
.btn-change-number {
  width: 100%;
  margin-top: 14px;
  padding: 12px;
  background: #f4efe4;
  border: 1px solid #c9bfa2;
  color: var(--ink);
  font-size: 13.5px;
  font-weight: 600;
  border-radius: 2px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .2s ease;
  font-family: inherit;
}
.btn-change-number:hover {
  background: #e8ded0;
  border-color: var(--ink);
  color: #000;
}
</style>

<script>
  let currentPhone = "";

  document.getElementById("sendOtpBtn").addEventListener("click", () => {
    const phone = document.getElementById("loginPhone").value.trim();
    const statusEl = document.getElementById("sendOtpStatus");
    const btn = document.getElementById("sendOtpBtn");

    if (!/^\d{10}$/.test(phone)) {
      statusEl.textContent = "Please enter a valid 10-digit number.";
      statusEl.className = "form-status error";
      return;
    }

    btn.disabled = true;
    btn.textContent = "Sending...";
    statusEl.textContent = "";

    fetch("/api/account/send_otp", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ phone })
    })
    .then(r => r.json())
    .then(res => {
      if (res.success) {
        currentPhone = phone;
        document.getElementById("stepPhone").style.display = "none";
        document.getElementById("stepOtp").style.display = "block";
        const otpInput = document.getElementById("loginOtp");
        otpInput.value = ""; // Keep blank, no auto-fill

        const infoBox = document.getElementById("otpInfoBox");
        infoBox.innerHTML = `📱 An OTP has been sent to <strong>+91 ${phone}</strong>.<br><small style="color:#666;">Valid for 10 minutes. Please check your SMS messages and enter the 6-digit code below.</small>`;

        document.getElementById("verifyOtpStatus").textContent = "";
        otpInput.focus();
      } else {
        statusEl.textContent = res.error || "Failed to send OTP.";
        statusEl.className = "form-status error";
        btn.disabled = false;
        btn.textContent = "Send OTP →";
      }
    })
    .catch(() => {
      statusEl.textContent = "Network error. Please try again.";
      statusEl.className = "form-status error";
      btn.disabled = false;
      btn.textContent = "Send OTP →";
    });
  });

  document.getElementById("verifyOtpBtn").addEventListener("click", () => {
    const otp = document.getElementById("loginOtp").value.trim();
    const name = document.getElementById("loginName").value.trim();
    const statusEl = document.getElementById("verifyOtpStatus");
    const btn = document.getElementById("verifyOtpBtn");

    if (!/^\d{6}$/.test(otp)) {
      statusEl.textContent = "Enter the 6-digit OTP.";
      statusEl.className = "form-status error";
      return;
    }

    btn.disabled = true;
    btn.textContent = "Verifying...";

    fetch("/api/account/verify_otp", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ phone: currentPhone, otp, name })
    })
    .then(r => r.json())
    .then(res => {
      if (res.success) {
        statusEl.textContent = "✓ Logged in! Redirecting...";
        statusEl.className = "form-status success";
        window.location.href = res.redirect || "/account/orders";
      } else {
        statusEl.textContent = res.error || "Verification failed.";
        statusEl.className = "form-status error";
        btn.disabled = false;
        btn.textContent = "Verify & Login →";
      }
    })
    .catch(() => {
      statusEl.textContent = "Network error. Please try again.";
      statusEl.className = "form-status error";
      btn.disabled = false;
      btn.textContent = "Verify & Login →";
    });
  });

  document.getElementById("backToPhoneBtn").addEventListener("click", () => {
    document.getElementById("stepOtp").style.display = "none";
    document.getElementById("stepPhone").style.display = "block";
    const btn = document.getElementById("sendOtpBtn");
    btn.disabled = false;
    btn.textContent = "Send OTP →";
  });

  // Allow pressing Enter on OTP field
  document.getElementById("loginOtp").addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById("verifyOtpBtn").click();
  });
  document.getElementById("loginPhone").addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById("sendOtpBtn").click();
  });
</script>

</body>
</html>
