<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Wishlist — {{ settings.brand_name }}</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon.svg') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="simple-header">
  <div class="wrap">
    <a href="/" class="logo" style="font-size:20px;">SIZZLING <em>by KBA</em></a>
    <div style="display:flex; gap:12px; align-items:center;">
      <a href="/" class="btn btn-outline" style="padding:8px 14px; font-size:12.5px; display:inline-flex; align-items:center; gap:6px;">🏠 Back to Home</a>
      <a href="/account/orders" class="btn btn-outline" style="padding:8px 14px; font-size:12.5px;">My Orders</a>
    </div>
  </div>
</div>

<div class="simple-page">
  <div class="wrap" style="max-width:960px;">
    <div style="margin-bottom:32px;">
      <span class="eyebrow">Personal Wardrobe</span>
      <h1 style="margin-top:12px;">♡ My Saved Wishlist</h1>
      <p class="sub">Items you have saved to your personal collection.</p>
    </div>

    <!-- Dynamic Wishlist Grid -->
    <div id="wishlistGrid" class="grid" style="grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:22px;">
      <!-- Populated dynamically from saved items -->
    </div>

    <!-- Empty Wishlist State -->
    <div id="wishlistEmpty" style="text-align:center; padding:80px 20px; opacity:0.7; display:none;">
      <div style="font-size:52px; margin-bottom:16px;">♡</div>
      <p style="font-size:18px; font-weight:600; color:#fff;">Your wishlist is empty.</p>
      <p style="font-size:14px; margin-top:8px; color:#aaa;">Click the ♡ heart on any garment in our shop to save it here.</p>
      <a href="/" class="btn btn-brass" style="margin-top:24px; padding:12px 32px; font-weight:700;">Browse Collection →</a>
    </div>

  </div>
</div>

<script>
(function() {
  const ALL_PRODUCTS = {{ all_products_json|safe }};
  const DB_PRODUCTS = {{ db_products|tojson|safe }};
  const WISHLIST_KEY = "sizzling_wishlist";

  function getWishlistIds() {
    try {
      const raw = localStorage.getItem(WISHLIST_KEY);
      const local = raw ? JSON.parse(raw) : [];
      const dbIds = DB_PRODUCTS.map(function(p) { return p.id; });
      const combined = Array.from(new Set(local.concat(dbIds).map(Number)));
      return combined;
    } catch(e) {
      return [];
    }
  }

  function renderWishlist() {
    const ids = getWishlistIds();
    const grid = document.getElementById("wishlistGrid");
    const empty = document.getElementById("wishlistEmpty");
    if (!grid || !empty) return;

    const savedProducts = ALL_PRODUCTS.filter(function(p) {
      return ids.indexOf(Number(p.id)) !== -1;
    });

    if (savedProducts.length === 0) {
      grid.style.display = "none";
      empty.style.display = "block";
      return;
    }

    grid.style.display = "grid";
    empty.style.display = "none";

    grid.innerHTML = savedProducts.map(function(p) {
      const formattedPrice = p.price ? "₹" + Number(p.price).toLocaleString("en-IN") : "Price on request";
      return (
        '<div class="card" id="wishCard-' + p.id + '" style="position:relative;">' +
          '<div class="card-art">' +
            '<img src="/static/images/' + p.image_path + '" alt="' + p.name + '" loading="lazy" class="product-model-img">' +
            '<button class="wishlist-remove-btn" onclick="removeWishItem(' + p.id + ')" title="Remove from wishlist" ' +
              'style="position:absolute; top:10px; right:10px; background:rgba(20,23,28,0.88); border:1px solid rgba(239,68,68,0.5); ' +
                     'color:#ef4444; width:34px; height:34px; border-radius:50%; font-size:18px; ' +
                     'cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:5;">' +
              '♥' +
            '</button>' +
          '</div>' +
          '<div class="card-body">' +
            '<h3>' + p.name + '</h3>' +
            '<p class="desc">' + (p.description || '') + '</p>' +
            '<div class="card-price-row">' +
              '<span class="card-price">' + formattedPrice + '</span>' +
              '<span class="card-fit-note">Bespoke Fit</span>' +
            '</div>' +
            '<a href="/#' + p.category + '" class="btn btn-brass" style="margin-top:14px; width:100%; padding:12px; justify-content:center; font-weight:700;">' +
              'View Garment &amp; Order →' +
            '</a>' +
          '</div>' +
        '</div>'
      );
    }).join("");
  }

  window.removeWishItem = function(id) {
    try {
      let list = JSON.parse(localStorage.getItem(WISHLIST_KEY) || "[]").map(Number);
      list = list.filter(function(x) { return x !== Number(id); });
      localStorage.setItem(WISHLIST_KEY, JSON.stringify(list));
    } catch(e) {}

    fetch("/api/wishlist/toggle", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ product_id: id })
    }).catch(function() {});

    const card = document.getElementById("wishCard-" + id);
    if (card) {
      card.style.transition = "opacity 0.25s, transform 0.25s";
      card.style.opacity = "0";
      card.style.transform = "scale(0.95)";
      setTimeout(renderWishlist, 260);
    } else {
      renderWishlist();
    }
  };

  renderWishlist();
})();
</script>

</body>
</html>
